<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opening Course...</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }
        .loader {
            border: 5px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 5px solid white;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .message {
            font-size: 24px;
            margin: 20px 0;
        }
        .sub-message {
            font-size: 14px;
            opacity: 0.8;
            margin-top: 10px;
        }
        .store-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 30px;
            background: white;
            color: #667eea;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            transition: transform 0.2s;
        }
        .store-btn:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="loader"></div>
        <div class="message">Opening Course...</div>
        <div class="sub-message" id="subMessage">Launching app</div>
        <a href="#" id="storeLink" class="store-btn" style="display: none;">
            Download App
        </a>
    </div>

    <script>
        const urlParams  = new URLSearchParams(window.location.search);
        const type       = urlParams.get('type');       // 'test' | 'video' | 'pdf' | null
        const id         = urlParams.get('id');         // courseId (course link)
        const categoryId = urlParams.get('categoryId'); // categoryId (content link)
        const courseId   = urlParams.get('courseId');   // courseId (content link)

        let customScheme = null;

        if (type === 'test' && categoryId) {
            document.querySelector('.message').textContent = 'Opening Test Series...';
            customScheme = courseId
                ? `flutteredu://test/${categoryId}?cid=${courseId}`
                : `flutteredu://test/${categoryId}`;

        } else if (type === 'video' && categoryId) {
            document.querySelector('.message').textContent = 'Opening Videos...';
            customScheme = courseId
                ? `flutteredu://video/${categoryId}?cid=${courseId}`
                : `flutteredu://video/${categoryId}`;

        } else if (type === 'pdf' && categoryId) {
            document.querySelector('.message').textContent = 'Opening Study Material...';
            customScheme = courseId
                ? `flutteredu://pdf/${categoryId}?cid=${courseId}`
                : `flutteredu://pdf/${categoryId}`;

        } else if (id) {
            // ── Course link ───────────────────────────────────────────
            document.querySelector('.message').textContent = 'Opening Course...';
            customScheme = `flutteredu://course/${id}`;
        }

        if (customScheme) {
            window.location.href = customScheme;

            setTimeout(() => {
                document.getElementById('subMessage').textContent =
                    "App not installed? Download it now!";
                document.getElementById('storeLink').style.display = 'inline-block';
                document.getElementById('storeLink').href =
                    'https://play.google.com/store/apps/details?id=org.indiandevelopers.sodhpeeth3';
            }, 2000);
        } else {
            document.querySelector('.message').textContent = 'Invalid Link';
            document.getElementById('subMessage').textContent =
                "This link is invalid or expired.";
        }
    </script>
</body>
</html>
